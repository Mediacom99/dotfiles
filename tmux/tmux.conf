# ================================
# BASIC SETTINGS
# ================================

# Use Ctrl-a as prefix instead of Ctrl-b (easier to reach)
# Unbind the default prefix first
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g default-shell /usr/bin/fish

# Enable 256 colors and true color support (important for Neovim themes)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# Start window and pane numbering at 1 (easier than reaching for 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (keeps numbering sequential)
set -g renumber-windows on

# Increase scrollback buffer size (useful for long outputs)
set -g history-limit 10000

# Enable mouse support (useful for resizing panes and selecting text)
# set -g mouse on

# Reduce escape time (important for Neovim responsiveness)
set -sg escape-time 0

# Enable focus events (helps Neovim detect when tmux pane gains/loses focus)
set -g focus-events on

# ================================
# VIM-STYLE KEYBINDINGS
# ================================

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (hold prefix + key)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Enter copy mode with prefix + v (like visual mode in vim)
bind v copy-mode

# ================================
# PANE AND WINDOW MANAGEMENT
# ================================

# Split panes with | and - (more intuitive than % and ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

