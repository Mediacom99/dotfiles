#
# ================================
# STATUS BAR CUSTOMIZATION
# ================================

# Status bar position
set -g status-position top

# Status bar colors (optimized for Gruber Darker theme)
set -g status-bg colour234    # Very dark gray background
set -g status-fg colour15     # White/light gray text

# Left side of status bar (Gruber Darker colors)
set -g status-left-length 20
set -g status-left '#[fg=colour234,bg=colour11,bold] #S #[fg=colour11,bg=colour236] '

# Right side of status bar (Gruber Darker colors)
set -g status-right-length 50
set -g status-right '#[fg=colour234,bg=colour10,bold] %d/%m #[fg=colour234,bg=colour11,bold] %H:%M:%S '

# Window status format (Gruber Darker colors)
setw -g window-status-current-format ' #I#[fg=colour15]:#[fg=colour11]#W#[fg=colour10]#F '
setw -g window-status-format ' #I#[fg=colour8]:#[fg=colour15]#W#[fg=colour8]#F '

# Pane border colors (Gruber Darker colors)
set -g pane-border-style fg=colour8           # Inactive borders - dark gray
set -g pane-active-border-style fg=colour11   # Active border - bright yellow

# ================================
# USEFUL SHORTCUTS
# ================================

# Reload tmux config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

